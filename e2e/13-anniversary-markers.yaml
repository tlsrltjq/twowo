# 기념일 마커: 달력에 100일·주년 표시 확인
# 기념일 = 2024-06-20 설정 → June 20, 2026 = 2주년
appId: host.exp.Exponent
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
- launchApp
- waitForAnimationToEnd

# 로그인 (이미 로그인 상태면 스킵)
- runFlow:
    when:
      visible: "로그인"
    commands:
      - tapOn:
          id: "input-email"
      - inputText: ${TEST_EMAIL}
      - tapOn:
          id: "input-password"
      - inputText: ${TEST_PASSWORD}
      - tapOn: "로그인"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "허용"
          commands:
            - tapOn: "허용"

- waitForAnimationToEnd

# 설정 탭에서 기념일 설정
- tapOn:
    id: "tab-settings"
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/13-settings-before

# 기념일 편집 버튼 탭
- tapOn:
    id: "btn-edit-anniversary"
- waitForAnimationToEnd

# 날짜 입력 (2024-06-20: 2주년이 2026-06-20에 뜸)
- tapOn:
    id: "input-anniversary"
- eraseText: 20
- inputText: "2024-06-20"
- tapOn: "저장"
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/13-anniversary-saved

# 캘린더 탭으로 이동
- tapOn:
    id: "tab-calendar"
- waitForAnimationToEnd

# 달력 뷰 스크린샷 (June 2026, 20일에 2주년 마커)
- assertVisible: "달력"
- takeScreenshot: e2e/screenshots/13-calendar-june-markers

# 주간 뷰 전환
- tapOn: "주"
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/13-week-view

# 다음 주 (6월 20일이 포함된 주)로 이동
- tapOn: "›"
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/13-week-anniversary-chip
