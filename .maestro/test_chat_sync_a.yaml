appId: host.exp.Exponent
---
# Dev1 (Account A, iPhone 14 Pro) — B가 보낸 채팅 수신 확인
- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000
# 탭바: 채팅 탭 (2번째, x=30%, y=93%)
- tapOn:
    point: "30%,93%"
- extendedWaitUntil:
    visible:
      id: "screen-chat"
    timeout: 10000
- takeScreenshot: "chat_sync_a"
