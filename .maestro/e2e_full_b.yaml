    commands:
      - tapOn:
          id: "switch-our-playlist"
      - waitForAnimationToEnd
- takeScreenshot: "B_12_lab_all_on"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd

# ── 사이드바 ─────────────────────────────────────────────────────────
