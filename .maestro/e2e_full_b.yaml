appId: host.exp.Exponent
---
# Account B (iPhone 14 Pro) — 전체 E2E 플로우 v2
# B는 A와의 동기화 확인 + 자체 입력 + 갭 보강 (빙고, 밥, 탭 전환, 검증)

# ── 앱 진입 ──────────────────────────────────────────────────────────
- launchApp
- waitForAnimationToEnd
- openLink: "exp://192.168.10.213:8081"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "열기"
    commands:
      - tapOn: "열기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "열기"
    commands:
      - tapOn: "열기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "열기"
    commands:
      - tapOn: "열기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "허용 안 함"
    commands:
      - tapOn: "허용 안 함"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "둘다좋아"
    commands:
      - tapOn:
          text: "둘다좋아"
          index: 0
      - waitForAnimationToEnd

# ── 로그인 (이미 로그인된 경우 스킵) ───────────────────────────────
- runFlow:
    when:
      visible:
        id: "input-email"
    commands:
      - tapOn:
          id: "input-email"
      - inputText: "test_b_1781871829@mailinator.com"
      - tapOn:
          id: "input-password"
      - inputText: "Test@1234"
      - tapOn: "로그인"
      - runFlow:
          when:
            visible: "허용 안 함"
          commands:
            - tapOn: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "지금 안 함"
          commands:
            - tapOn: "지금 안 함"
            - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 60000
- takeScreenshot: "B_01_home"

# ── 채팅 — A메시지 확인 + 빈 입력 검증 + 답장 ──────────────────────
- tapOn:
    id: "tab-chat"
- waitForAnimationToEnd
- takeScreenshot: "B_02_chat_a_messages"

# [검증] 빈 입력 전송 시도 — disabled 상태여야 함
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- takeScreenshot: "B_03_chat_empty_blocked"

# 답장
- tapOn:
    id: "input-chat"
- inputText: "나도 저녁 같이 먹자! 🍜"
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- tapOn:
    id: "input-chat"
- inputText: "오늘 정말 보고 싶어 💕"
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- takeScreenshot: "B_04_chat_replied"
- hideKeyboard

# ── 캘린더 — A 이벤트 동기화 + 뷰 탭 전환 ──────────────────────────
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
- takeScreenshot: "B_05_calendar_synced"

# B도 일정 추가
- tapOn:
    id: "btn-new-event"
- waitForAnimationToEnd
- tapOn:
    id: "input-event-title"
- inputText: "같이 요리하기 🍳"
- pressKey: enter
- scrollUntilVisible:
    element:
      id: "btn-event-save-bottom"
- tapOn:
    id: "btn-event-save-bottom"
- waitForAnimationToEnd
- takeScreenshot: "B_06_calendar_b_event"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd

# 운동 탭
- tapOn: "운동"
- waitForAnimationToEnd
- takeScreenshot: "B_07_calendar_exercise_tab"

# 데이트 탭
- tapOn: "데이트"
- waitForAnimationToEnd
- takeScreenshot: "B_08_calendar_date_tab"

# 달력으로 복귀
- tapOn: "달력"
- waitForAnimationToEnd

# ── 컨디션 — 에너지/기분 값 선택 ────────────────────────────────────
- tapOn:
    id: "tab-mood"
- waitForAnimationToEnd
- takeScreenshot: "B_09_mood_screen"
- runFlow:
    when:
      visible: "수정"
    commands:
      - tapOn: "수정"
      - waitForAnimationToEnd

# 에너지 레벨 4 선택 (B는 4)
- runFlow:
    when:
      visible:
        id: "btn-energy-4"
    commands:
      - tapOn:
          id: "btn-energy-4"
      - waitForAnimationToEnd

# 기분 '최고' 선택
- runFlow:
    when:
      visible:
        id: "btn-mood-great"
    commands:
      - tapOn:
          id: "btn-mood-great"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "btn-mood-save"
    commands:
      - scrollUntilVisible:
          element:
            id: "btn-mood-save"
      - tapOn:
          id: "btn-mood-save"
      - waitForAnimationToEnd
- takeScreenshot: "B_10_mood_saved"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd

# ── 실험실 — 기능 ON ─────────────────────────────────────────────────
