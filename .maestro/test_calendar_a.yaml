appId: host.exp.Exponent
---
# Dev1 (Account A, iPhone 14 Pro) — 캘린더 이벤트 생성
- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 10000
- takeScreenshot: "calendar_a_before"
- tapOn: "새 일정 추가"
- waitForAnimationToEnd
- tapOn:
    id: "input-event-title"
- eraseText: 30
- inputText: "E2E 테스트"
- waitForAnimationToEnd
- takeScreenshot: "calendar_a_before_save"
# 헤더의 저장 버튼 — 키보드와 무관하게 항상 화면 상단에 노출됨
- tapOn:
    id: "btn-event-save"
- waitForAnimationToEnd
- takeScreenshot: "calendar_a_after_save_tap"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
- takeScreenshot: "calendar_a_event_created"
