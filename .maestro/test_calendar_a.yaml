appId: host.exp.Exponent
---
# Dev1 (Account A, iPhone 14 Pro) — 캘린더 이벤트 생성
- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 10000
- takeScreenshot: "calendar_a_before"
- tapOn: "새 일정 추가"
- waitForAnimationToEnd
- tapOn:
    id: "input-event-title"
- eraseText: 30
- inputText: "E2E 테스트"
- tapOn:
    id: "input-event-date"
- waitForAnimationToEnd
- tapOn:
    id: "btn-event-save"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
- takeScreenshot: "calendar_a_event_created"
