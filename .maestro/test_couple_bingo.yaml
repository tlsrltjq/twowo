appId: host.exp.Exponent
---
# couple-bingo 전체 시나리오
# 전제: 사이드바에서 couple-bingo ON, Account A 로그인

- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000

# ──── 빙고 탭 진입 ────────────────────────────────────────────────────────────
- tapOn:
    id: "btn-sidebar-open"
- waitForAnimationToEnd
- tapOn: "데이트 빙고"
- extendedWaitUntil:
    visible:
      id: "screen-bingo"
    timeout: 15000
- takeScreenshot: "bingo_01_enter"

# ──── 기존 보드 초기화 (최대 3개 archive) ────────────────────────────────────
# 활성 보드가 있으면 탭 1 선택 후 archive
- runFlow:
    when:
      visible:
        id: "btn-archive"
    commands:
      - tapOn: { id: "btn-archive" }
      - waitForAnimationToEnd
      - tapOn: "확인"
      - waitForAnimationToEnd
      # history 화면에서 게임으로 복귀
      - tapOn: { id: "btn-bingo-back" }
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "btn-tab-1"
    commands:
      - tapOn: { id: "btn-tab-1" }
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "btn-archive"
    commands:
      - tapOn: { id: "btn-archive" }
      - waitForAnimationToEnd
      - tapOn: "확인"
      - waitForAnimationToEnd
      - tapOn: { id: "btn-bingo-back" }
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "btn-tab-1"
    commands:
      - tapOn: { id: "btn-tab-1" }
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "btn-archive"
    commands:
      - tapOn: { id: "btn-archive" }
      - waitForAnimationToEnd
      - tapOn: "확인"
      - waitForAnimationToEnd
      - tapOn: { id: "btn-bingo-back" }
      - waitForAnimationToEnd

# ──── EmptyState 대기 및 확인 ────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "btn-empty-new"
    timeout: 8000
- takeScreenshot: "bingo_02_empty_state"
- assertVisible: { id: "btn-empty-history" }

# ──── EmptyState → 이전 기록 진입/복귀 ───────────────────────────────────────
- tapOn: { id: "btn-empty-history" }
- waitForAnimationToEnd
- takeScreenshot: "bingo_03_history_from_empty"
- tapOn: { id: "btn-bingo-back" }
- extendedWaitUntil:
    visible:
      id: "btn-empty-new"
    timeout: 5000

# ──── 새 빙고판 만들기 (빙고 1) ───────────────────────────────────────────────
- tapOn: { id: "btn-empty-new" }
- waitForAnimationToEnd
- takeScreenshot: "bingo_04_setup_view"

- tapOn: { id: "btn-fill-default" }
- waitForAnimationToEnd
- takeScreenshot: "bingo_05_setup_filled"
- assertVisible: { id: "btn-start-board" }

- tapOn: { id: "btn-start-board" }
- extendedWaitUntil:
    visible:
      id: "btn-archive"
    timeout: 10000
- takeScreenshot: "bingo_06_game_board1"
- assertVisible: "0 / 25 완료"

# ──── 기록으로 넘기기 취소 확인 ──────────────────────────────────────────────
- tapOn: { id: "btn-archive" }
- waitForAnimationToEnd
- takeScreenshot: "bingo_07_archive_alert"
- tapOn: "취소"
- waitForAnimationToEnd
- assertVisible: { id: "btn-archive" }

# ──── Clock → 이전 기록 → 복귀 ────────────────────────────────────────────────
- tapOn: { id: "btn-history" }
- waitForAnimationToEnd
- takeScreenshot: "bingo_08_history_view"
- tapOn: { id: "btn-bingo-back" }
- extendedWaitUntil:
    visible:
      id: "btn-archive"
    timeout: 5000

# ──── 두 번째 빙고 추가 → 탭 바 확인 ────────────────────────────────────────
- tapOn: { id: "btn-new-board" }
- waitForAnimationToEnd
- tapOn: { id: "btn-fill-default" }
- waitForAnimationToEnd
- tapOn: { id: "btn-start-board" }
- extendedWaitUntil:
    visible:
      id: "btn-tab-1"
    timeout: 10000
- takeScreenshot: "bingo_09_two_boards_tabs"
- assertVisible: { id: "btn-tab-2" }

# 탭 전환
- tapOn: { id: "btn-tab-2" }
- waitForAnimationToEnd
- takeScreenshot: "bingo_10_tab2_active"

- tapOn: { id: "btn-tab-1" }
- waitForAnimationToEnd
- takeScreenshot: "bingo_11_tab1_active"

# ──── 세 번째 빙고 추가 → 최대 3개 확인 ──────────────────────────────────────
- tapOn: { id: "btn-new-board" }
- waitForAnimationToEnd
- tapOn: { id: "btn-fill-default" }
- tapOn: { id: "btn-start-board" }
- extendedWaitUntil:
    visible:
      id: "btn-tab-3"
    timeout: 10000
- takeScreenshot: "bingo_12_three_boards"
- assertNotVisible:
    id: "btn-new-board"

# ──── 기록으로 넘기기 → 이전 기록 카드 확인 ──────────────────────────────────
- tapOn: { id: "btn-archive" }
- waitForAnimationToEnd
- tapOn: "확인"
- extendedWaitUntil:
    visible:
      id: "btn-history-card-0"
    timeout: 10000
- takeScreenshot: "bingo_13_history_with_card"

# 카드 탭 → 상세 읽기 전용 뷰
- tapOn: { id: "btn-history-card-0" }
- waitForAnimationToEnd
- takeScreenshot: "bingo_14_history_detail"
- assertVisible:
    id: "text-detail-header"

# 상세 → 이전 기록 목록
- tapOn: { id: "btn-bingo-back" }
- waitForAnimationToEnd
- assertVisible: { id: "btn-history-card-0" }
- takeScreenshot: "bingo_15_history_list"

# 이전 기록 → 게임으로
- tapOn: { id: "btn-bingo-back" }
- extendedWaitUntil:
    visible:
      id: "btn-archive"
    timeout: 5000
- takeScreenshot: "bingo_16_back_to_game"
- assertVisible: { id: "screen-bingo" }
