appId: host.exp.Exponent
---
# Account A (iPhone 16) — 전체 E2E 플로우 v2
# 커버: 모든 탭·기능 진입 + 주요 입력 + 빈 입력 방어 확인

# ── 앱 진입 ──────────────────────────────────────────────────────────
- launchApp
- waitForAnimationToEnd
# 현재 IP로 무조건 딥링크 — 캐시된 구 IP 우회
- openLink: "exp://192.168.10.213:8081"
- waitForAnimationToEnd
# iOS 시스템 "열기" 알럿 (3회 반복 가능)
- runFlow:
    when:
      visible: "열기"
    commands:
      - tapOn: "열기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "열기"
    commands:
      - tapOn: "열기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "열기"
    commands:
      - tapOn: "열기"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "허용 안 함"
    commands:
      - tapOn: "허용 안 함"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "둘다좋아"
    commands:
      - tapOn:
          text: "둘다좋아"
          index: 0
      - waitForAnimationToEnd

# ── 로그인 (이미 로그인된 경우 스킵) ───────────────────────────────
- runFlow:
    when:
      visible:
        id: "input-email"
    commands:
      - takeScreenshot: "A_01_login_screen"
      - tapOn:
          id: "input-email"
      - inputText: "test_a_1781871829@mailinator.com"
      - tapOn:
          id: "input-password"
      - inputText: "Test@1234"
      - tapOn: "로그인"
      - runFlow:
          when:
            visible: "허용 안 함"
          commands:
            - tapOn: "허용 안 함"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "지금 안 함"
          commands:
            - tapOn: "지금 안 함"
            - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 60000
- takeScreenshot: "A_02_home"

# ── 홈 스크롤 ────────────────────────────────────────────────────────
- scroll
- takeScreenshot: "A_03_home_scrolled"
- scrollUntilVisible:
    direction: UP
    element:
      id: "screen-home"

# ── 채팅 ────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-chat"
- waitForAnimationToEnd
- takeScreenshot: "A_04_chat_empty_state"

# [검증] 빈 입력 전송 시도 — 버튼이 disabled라 아무 변화 없어야 함
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- takeScreenshot: "A_05_chat_empty_send_blocked"

# 실제 메시지 전송
- tapOn:
    id: "input-chat"
- inputText: "안녕하세요! 오늘 뭐 해? 😊"
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- tapOn:
    id: "input-chat"
- inputText: "저녁에 뭐 먹을까? 🍕"
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- tapOn:
    id: "input-chat"
- inputText: "보고싶다 💕"
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- takeScreenshot: "A_06_chat_messages"
- hideKeyboard

# ── 캘린더 ────────────────────────────────────────────────────────
- tapOn:
