appId: host.exp.Exponent
---
# gift-wishlist — 선물 위시리스트 진입 + 아이템 추가 테스트
# 전제: 사이드바에서 gift-wishlist ON

- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000

# 사이드바 → 선물 위시리스트
- tapOn:
    id: "btn-sidebar-open"
- waitForAnimationToEnd
- tapOn: "선물 위시리스트"
- extendedWaitUntil:
    visible:
      id: "screen-gift-wishlist"
    timeout: 15000
- takeScreenshot: "gift_wishlist_screen_partner"

# 내 목록 탭 전환 (FAB는 내 탭에서만 표시)
- tapOn:
    id: "tab-wishlist-mine"
- waitForAnimationToEnd
- takeScreenshot: "gift_wishlist_screen_mine"

# FAB → 모달
- tapOn:
    id: "fab-wishlist"
- extendedWaitUntil:
    visible:
      id: "input-wishlist-name"
    timeout: 10000

# 아이템 이름 입력
- tapOn:
    id: "input-wishlist-name"
- inputText: "에어팟 프로"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: "gift_wishlist_modal_filled"

# 추가하기
- tapOn:
    id: "btn-wishlist-save"
- waitForAnimationToEnd
- takeScreenshot: "gift_wishlist_saved"
