appId: host.exp.Exponent
---
# gift-wishlist — 선물 위시리스트 진입 + 탭 전환 + 화면 확인 테스트
# 주의: transparent Modal은 Maestro accessibility tree 미노출 → FAB 탭까지만 검증
# 전제: 사이드바에서 gift-wishlist ON

- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000

# 사이드바 → 선물 위시리스트
- tapOn:
    id: "btn-sidebar-open"
- waitForAnimationToEnd
- tapOn: "선물 위시리스트"
- extendedWaitUntil:
    visible:
      id: "screen-gift-wishlist"
    timeout: 15000
- takeScreenshot: "gift_wishlist_screen_partner"

# 내 목록 탭 전환 (testID 사용 — 탭은 Modal 밖)
- tapOn:
    id: "tab-wishlist-mine"
- waitForAnimationToEnd
- takeScreenshot: "gift_wishlist_screen_mine"

# FAB 탭 (모달 열림 시각적 확인)
- tapOn:
    id: "fab-wishlist"
- waitForAnimationToEnd
- takeScreenshot: "gift_wishlist_modal_opened"
