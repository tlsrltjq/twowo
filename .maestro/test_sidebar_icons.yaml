appId: host.exp.Exponent
---
# 사이드바 아이콘 + 활성 기능 표시 테스트
# 전제: daily-gratitude / our-playlist 실험실에서 ON 상태 (한 번 수동 또는 test_lab_sync_a 실행 후 유지됨)

# 1. 홈 화면 진입
- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000

# 2. 사이드바 열기 → 활성 기능 목록 확인
- tapOn:
    id: "btn-sidebar-open"
- waitForAnimationToEnd
- takeScreenshot: "sidebar_lucide_icons"
- assertVisible: "오늘의 고마움"
- assertVisible: "우리의 플레이리스트"
- takeScreenshot: "sidebar_features_visible"
