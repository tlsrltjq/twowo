appId: host.exp.Exponent
---
# daily-food — 오늘 뭐 먹었어 진입 + 화면 확인 테스트
# 주의: transparent Modal은 Maestro accessibility tree 미노출 → FAB 탭까지만 검증
# 전제: 사이드바에서 daily-food ON

- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000

# 사이드바 → 오늘 뭐 먹었어
- tapOn:
    id: "btn-sidebar-open"
- waitForAnimationToEnd
- tapOn: "오늘의 밥"
- extendedWaitUntil:
    visible:
      id: "screen-daily-food"
    timeout: 15000
- takeScreenshot: "daily_food_screen"

# FAB 탭 (모달 열림 시각적 확인)
- tapOn:
    id: "fab-food"
- waitForAnimationToEnd
- takeScreenshot: "daily_food_modal_opened"
