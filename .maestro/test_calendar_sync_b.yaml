appId: host.exp.Exponent
---
# Dev2 (Account B, iPhone 16) — A가 만든 이벤트 동기화 확인
- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 10000
- takeScreenshot: "calendar_sync_b"
