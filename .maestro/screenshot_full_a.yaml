appId: host.exp.Exponent
---
# Account A (iPhone 16) — 전체 화면 스크린샷 플로우

# ── 앱 진입 ──────────────────────────────────────────────────────────
- launchApp
- runFlow:
    when:
      visible: "허용 안 함"
    commands:
      - tapOn: "허용 안 함"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Start a local development server"
    commands:
      - openLink: "exp://192.168.45.168:8081"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "둘다좋아"
    commands:
      - tapOn:
          text: "둘다좋아"
          index: 0
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd

# ── 로그인 (이미 로그인된 경우 스킵) ───────────────────────────────
- runFlow:
    when:
      visible:
        id: "input-email"
    commands:
      - takeScreenshot: "01_login_screen"
      - tapOn:
          id: "input-email"
      - inputText: "test_a_1781871829@mailinator.com"
      - tapOn:
          id: "input-password"
      - inputText: "Test@1234"
      - tapOn: "로그인"
      - runFlow:
          when:
            visible: "허용 안 함"
          commands:
            - tapOn: "허용 안 함"
            - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 60000
- takeScreenshot: "02_home_screen"

# ── 홈 스크롤 ────────────────────────────────────────────────────────
- scroll
- takeScreenshot: "03_home_scrolled"
- scrollUntilVisible:
    direction: UP
    element:
      id: "screen-home"

# ── 채팅 ────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-chat"
- waitForAnimationToEnd
- takeScreenshot: "04_chat_screen"
- tapOn:
    id: "input-chat"
- inputText: "안녕하세요! 오늘 뭐 해? 😊"
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- tapOn:
    id: "input-chat"
- inputText: "오늘 날씨가 너무 좋다 🌞"
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- tapOn:
    id: "input-chat"
- inputText: "저녁에 뭐 먹을까? 🍕"
- tapOn:
    id: "btn-chat-send"
- waitForAnimationToEnd
- takeScreenshot: "05_chat_messages"
- hideKeyboard

# ── 캘린더 ────────────────────────────────────────────────────────
- tapOn:
    id: "tab-calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 15000
- takeScreenshot: "06_calendar_month"
- tapOn:
    id: "btn-new-event"
- waitForAnimationToEnd
- takeScreenshot: "07_calendar_new_event_modal"
- tapOn:
    id: "input-event-title"
- inputText: "주말 데이트 🎬"
- pressKey: enter
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "btn-event-save-bottom"
- tapOn:
    id: "btn-event-save-bottom"
- waitForAnimationToEnd
- takeScreenshot: "08_calendar_after_save"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd

# ── 컨디션 탭 ────────────────────────────────────────────────────────
- tapOn:
    id: "tab-mood"
- waitForAnimationToEnd
- takeScreenshot: "09_mood_screen"
# 이미 저장된 경우 "수정" 눌러서 편집 모드 진입
- runFlow:
    when:
      visible: "수정"
    commands:
      - tapOn: "수정"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "btn-mood-save"
    commands:
      - scrollUntilVisible:
          element:
            id: "btn-mood-save"
      - tapOn:
          id: "btn-mood-save"
      - waitForAnimationToEnd
- takeScreenshot: "10_mood_saved"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd

# ── 실험실 — 모든 기능 ON ─────────────────────────────────────────
- tapOn:
    id: "tab-lab"
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: "11_lab_screen"
- tapOn:
    id: "switch-date-decision"
- waitForAnimationToEnd
- tapOn:
    id: "switch-couple-bingo"
- waitForAnimationToEnd
- tapOn:
    id: "switch-night-message"
- waitForAnimationToEnd
- tapOn:
    id: "switch-compliment-jar"
- waitForAnimationToEnd
- tapOn:
    id: "switch-daily-food"
- waitForAnimationToEnd
- tapOn:
    id: "switch-first-moments"
- waitForAnimationToEnd
- tapOn:
    id: "switch-gift-wishlist"
- waitForAnimationToEnd
- tapOn:
    id: "switch-daily-gratitude"
- waitForAnimationToEnd
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "switch-our-playlist"
    commands:
      - tapOn:
          id: "switch-our-playlist"
      - waitForAnimationToEnd
- takeScreenshot: "12_lab_all_on"
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd

