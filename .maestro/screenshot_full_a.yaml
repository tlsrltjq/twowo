      visible: "라운드 진행 중"
    commands:
      - tapOn: "한강 피크닉 🌸"
      - waitForAnimationToEnd
- takeScreenshot: "18_vote_voting"
- takeScreenshot: "19_vote_choice_made"
- tapOn:
    id: "btn-back"
- waitForAnimationToEnd

