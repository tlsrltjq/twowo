appId: host.exp.Exponent
---
# first-moments — 우리가 처음 한 것들 진입 + 화면 확인 테스트
# 주의: transparent Modal은 Maestro accessibility tree 미노출 → FAB 탭까지만 검증
# 전제: 사이드바에서 first-moments ON

- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000

# 사이드바 → 처음 한 것들
- tapOn:
    id: "btn-sidebar-open"
- waitForAnimationToEnd
- tapOn: "처음 한 것들"
- extendedWaitUntil:
    visible:
      id: "screen-first-moments"
    timeout: 15000
- takeScreenshot: "first_moments_screen"

# FAB 탭 (모달 열림 시각적 확인)
- tapOn:
    id: "fab-first-moments"
- waitForAnimationToEnd
- takeScreenshot: "first_moments_modal_opened"
