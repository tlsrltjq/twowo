appId: host.exp.Exponent
---
# compliment-jar — 칭찬 저금통 진입 + 화면 확인 테스트
# 주의: transparent Modal은 Maestro accessibility tree 미노출 → FAB 탭까지만 검증
# 전제: 사이드바에서 compliment-jar ON

- launchApp
- tapOn:
    text: "둘다좋아"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 90000

# 사이드바 → 칭찬 저금통
- tapOn:
    id: "btn-sidebar-open"
- waitForAnimationToEnd
- tapOn: "칭찬 저금통"
- extendedWaitUntil:
    visible:
      id: "screen-compliment-jar"
    timeout: 15000
- takeScreenshot: "compliment_jar_screen"

# FAB 탭 (모달 열림 시각적 확인 — screenshot만)
- tapOn:
    id: "fab-compliment"
- waitForAnimationToEnd
- takeScreenshot: "compliment_jar_modal_opened"
